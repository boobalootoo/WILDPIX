<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Map Pixelation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scrollbars */
            font-family: Arial, sans-serif;
        }
        #mapContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block; /* Always visible */
            z-index: 2;
        }
        #corsMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            z-index: 3;
            display: none;
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <div id="map"></div>
        <canvas id="canvas"></canvas>
        <div id="corsMessage">
            <p>Pixelation is not working due to CORS policy.</p>
            <p>The browser prevents access to image data from external map servers. This is not an error in the code, but a security feature to protect user data.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const corsMessage = document.getElementById('corsMessage');

        const map = L.map('map', {
            center: [54.5, -2.5],
            zoom: 6,
            maxZoom: 26,
            minZoom: 6,
            layers: [
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles © Esri',
                    maxNativeZoom: 18,
                    maxZoom: 26
                })
            ]
        });

        function applyPixelation() {
            const size = map.getSize();
            canvas.width = size.x;
            canvas.height = size.y;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            corsMessage.style.display = 'none';

            // Use html2canvas to capture the map view
            html2canvas(document.getElementById('map'), { useCORS: true }).then((capturedCanvas) => {
                // Check if the captured canvas has valid dimensions
                if (capturedCanvas.width === 0 || capturedCanvas.height === 0) {
                    console.error("html2canvas failed to capture the map, likely due to CORS.");
                    // Display the CORS message
                    corsMessage.style.display = 'block';
                    return; // Exit the function
                }

                ctx.drawImage(capturedCanvas, 0, 0, canvas.width, canvas.height);

                // Calculate the real-world meters per canvas pixel
                const metersPerPixel = 156543.03392 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom());

                // Determine the desired real-world size for each pixelated square
                let desiredMeterSize;
                const zoom = map.getZoom();
                if (zoom >= 18) {
                    desiredMeterSize = 1; // 1m x 1m squares
                } else if (zoom >= 15) {
                    desiredMeterSize = 10; // 10m x 10m squares
                } else if (zoom >= 12) {
                    desiredMeterSize = 100; // 100m x 100m squares
                } else if (zoom >= 9) {
                    desiredMeterSize = 1000; // 1km x 1km squares
                } else {
                    desiredMeterSize = 10000; // 10km x 10km squares
                }

                // Calculate the size of the pixelated block on the canvas
                const pixelSizeX = desiredMeterSize / metersPerPixel;
                const pixelSizeY = desiredMeterSize / metersPerPixel;
                
                // Iterate through the grid and draw average-colored squares
                for (let y = 0; y < canvas.height; y += pixelSizeY) {
                    for (let x = 0; x < canvas.width; x += pixelSizeX) {
                        const width = Math.min(pixelSizeX, canvas.width - x);
                        const height = Math.min(pixelSizeY, canvas.height - y);
                        
                        const imageData = ctx.getImageData(x, y, width, height);
                        const data = imageData.data;
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            r += data[i];
                            g += data[i + 1];
                            b += data[i + 2];
                            count++;
                        }

                        r = Math.floor(r / count);
                        g = Math.floor(g / count);
                        b = Math.floor(b / count);

                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        ctx.fillRect(x, y, width, height);
                    }
                }
            });
        }
        
        // Apply pixelation on initial load and whenever the map stops moving
        map.on('moveend', applyPixelation);
        window.onload = applyPixelation;

    </script>
</body>
</html>
