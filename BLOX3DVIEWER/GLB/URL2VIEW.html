<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB URL Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2d3748;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
        }

        #viewer-container {
            position: relative;
            width: 100%;
            height: 60vh;
            margin-top: 1rem;
            border-radius: 8px;
            overflow: hidden;
            background-color: #242424;
        }

        #viewer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.6);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            color: white;
            z-index: 10;
        }

        input, button {
            border-radius: 8px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-3xl font-bold mb-4 text-center">GLB Model Viewer</h1>
    <div class="w-full flex flex-col sm:flex-row items-center gap-4">
        <input type="text" id="model-url-input" class="flex-grow w-full sm:w-auto p-2 bg-gray-700 border border-gray-600 text-white placeholder-gray-400" placeholder="Paste GitHub GLB URL here...">
        <button id="load-button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded">Load Model</button>
    </div>
    <div id="viewer-container">
        <canvas id="viewer-canvas"></canvas>
        <div id="status-message">Enter a GLB file URL and click "Load Model".</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    window.onload = function() {
        const urlInput = document.getElementById('model-url-input');
        const loadButton = document.getElementById('load-button');
        const canvas = document.getElementById('viewer-canvas');
        const statusMessage = document.getElementById('status-message');
        const container = document.getElementById('viewer-container');

        let camera, scene, renderer, controls, currentModel, loader;

        // Function to convert a GitHub blob URL to a raw content URL
        function convertGithubUrl(url) {
            if (url.includes('github.com') && url.includes('/blob/')) {
                return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            return url;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize Three.js scene
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x242424);

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.25;

            loader = new THREE.GLTFLoader();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Load the selected GLB file
        function loadModel(url) {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse(node => {
                    if (node.isMesh) {
                        node.geometry.dispose();
                        node.material.dispose();
                    }
                });
                currentModel = null;
            }

            if (!url) {
                statusMessage.textContent = 'Please enter a valid URL.';
                return;
            }

            const rawUrl = convertGithubUrl(url);
            statusMessage.textContent = 'Loading...';

            loader.load(
                rawUrl,
                gltf => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    currentModel.position.sub(center);

                    statusMessage.textContent = 'Model loaded successfully!';
                    setTimeout(() => statusMessage.textContent = 'Use your mouse to rotate and zoom.', 2000);
                },
                xhr => {
                    const progress = (xhr.loaded / xhr.total) * 100;
                    statusMessage.textContent = `Loading: ${progress.toFixed(2)}%`;
                },
                error => {
                    console.error('Failed to load GLB model from URL:', rawUrl, 'Error details:', error);
                    statusMessage.textContent = 'Failed to load model. Please check the URL and your browser\'s console for details. (Possible CORS error).';
                }
            );
        }

        // Event listener for the button
        loadButton.addEventListener('click', () => {
            loadModel(urlInput.value);
        });

        // Optional: Load on pressing Enter key
        urlInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                loadModel(urlInput.value);
            }
        });

        // Start the application
        initThreeJS();
    };
</script>

</body>
</html>
