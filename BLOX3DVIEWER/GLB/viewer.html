<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDPIX GLB Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 95%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2d3748;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
        }
        #viewer-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            margin-top: 1rem;
            border-radius: 8px;
            overflow: hidden;
            background-color: #242424;
        }
        #arCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-message, #instructions-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.6);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-3xl font-bold mb-4 text-center">WILDPIX GLB Viewer</h1>
    <div class="w-full flex flex-col sm:flex-row items-center gap-4">
        <label for="model-selector" class="text-lg">Select a Model:</label>
        <select id="model-selector" class="flex-grow w-full sm:w-auto p-2 rounded-md bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Loading models...</option>
        </select>
    </div>
    <div id="viewer-container">
        <canvas id="arCanvas"></canvas>
        <div id="loading-message" class="hidden">Loading...</div>
        <div id="instructions-message">Select a model to view it.</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    window.onload = function() {
        const modelSelector = document.getElementById('model-selector');
        const arCanvas = document.getElementById('arCanvas');
        const loadingMessage = document.getElementById('loading-message');
        const instructionsMessage = document.getElementById('instructions-message');
        const container = document.getElementById('viewer-container');

        const GITHUB_API_URL = 'https://api.github.com/repos/boobalootoo/WILDPIX/contents/BLOX3DVIEWER/GLB';
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/boobalootoo/WILDPIX/main/BLOX3DVIEWER/GLB/';

        let camera, scene, renderer, controls, currentModel, loader;

        // Initialize Three.js scene
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x242424);

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: arCanvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // Add OrbitControls for user interaction
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // smooth camera movement
            controls.dampingFactor = 0.25;

            loader = new THREE.GLTFLoader();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Fetch the list of GLB files from GitHub
        async function fetchModels() {
            try {
                const response = await fetch(GITHUB_API_URL);
                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error('Could not retrieve file list from GitHub.');
                }

                // Filter for GLB files and populate the dropdown
                const glbFiles = files.filter(file => file.name.endsWith('.glb'));

                modelSelector.innerHTML = '<option value="">Select a model...</option>';
                glbFiles.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.name;
                    option.textContent = file.name;
                    modelSelector.appendChild(option);
                });

                if (glbFiles.length > 0) {
                    instructionsMessage.textContent = 'Select a model from the list above.';
                } else {
                    instructionsMessage.textContent = 'No GLB models found in the specified folder.';
                }

            } catch (error) {
                console.error('Failed to fetch models:', error);
                modelSelector.innerHTML = `<option value="">Error loading models.</option>`;
                instructionsMessage.textContent = `Error: ${error.message}. Please check the console.`;
            }
        }

        // Load the selected GLB file
        function loadModel(fileName) {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse(node => {
                    if (node.isMesh) {
                        node.geometry.dispose();
                        node.material.dispose();
                    }
                });
                currentModel = null;
            }

            loadingMessage.classList.remove('hidden');
            instructionsMessage.classList.add('hidden');

            const modelUrl = `${GITHUB_RAW_URL}${fileName}`;
            loader.load(
                modelUrl,
                gltf => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    // Optional: Center the model
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    currentModel.position.sub(center);

                    loadingMessage.classList.add('hidden');
                },
                xhr => {
                    // Progress bar logic if needed
                },
                error => {
                    console.error('Error loading GLB model:', error);
                    loadingMessage.classList.add('hidden');
                    instructionsMessage.classList.remove('hidden');
                    instructionsMessage.textContent = `Failed to load model: ${fileName}`;
                }
            );
        }

        // Event listener for dropdown selection
        modelSelector.addEventListener('change', (event) => {
            const fileName = event.target.value;
            if (fileName) {
                loadModel(fileName);
            }
        });

        // Start the application flow
        initThreeJS();
        fetchModels();
    };
</script>

</body>
</html>
