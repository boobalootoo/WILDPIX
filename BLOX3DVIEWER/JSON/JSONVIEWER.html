<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Object Viewer</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 flex flex-col items-center max-w-2xl w-full">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4 text-center">3D Object Viewer</h1>
        <p class="text-gray-600 mb-6 text-center">
            Upload a `three.js` Object JSON file to view the 3D model. Click and drag to rotate it.
        </p>

        <!-- Canvas Container -->
        <div class="w-full h-[400px] md:h-[600px] bg-gray-200 rounded-xl overflow-hidden relative">
            <canvas id="object-viewer" class="w-full h-full"></canvas>
            <div id="loading-message" class="absolute inset-0 flex items-center justify-center text-center p-4 bg-white bg-opacity-80 rounded-xl">
                <div class="text-gray-500 font-semibold">Please upload a JSON file to begin.</div>
            </div>
        </div>

        <div class="mt-6 flex flex-col items-center">
            <label for="json-upload" class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-full transition-colors duration-200 shadow-md">
                Upload JSON File
            </label>
            <input type="file" id="json-upload" accept=".json" class="hidden">
        </div>

    </div>

    <!-- Three.js and OrbitControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, object, loadingMessage;

        // Function to remove the existing object from the scene
        function removeExistingObject() {
            if (object) {
                scene.remove(object);
                // Dispose of geometry and material to free up memory
                object.traverse(child => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        child.material.dispose();
                    }
                });
                object = null; // Clear the object variable
            }
        }

        // Function to render the new model
        function renderModel(data) {
            removeExistingObject();
            try {
                const loader = new THREE.ObjectLoader();
                object = loader.parse(data);
                scene.add(object);
                loadingMessage.style.display = 'none';

                // --- Fix applied here: Dynamically adjust camera position and controls ---
                const box = new THREE.Box3().setFromObject(object);
                const center = new THREE.Vector3();
                box.getCenter(center);
                const size = new THREE.Vector3();
                box.getSize(size);

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ = Math.max(cameraZ, 2); // Ensure a minimum distance

                camera.position.set(center.x, center.y, center.z + cameraZ * 1.5);
                controls.target.copy(center);
                controls.update();

            } catch (error) {
                loadingMessage.style.display = 'flex';
                loadingMessage.innerHTML = `<div class="text-red-500 font-semibold">Error loading model. Please ensure the JSON is a valid three.js Object JSON.</div>`;
                console.error('Error parsing JSON:', error);
            }
        }

        window.onload = function() {
            loadingMessage = document.getElementById('loading-message');
            const canvas = document.getElementById('object-viewer');
            const fileInput = document.getElementById('json-upload');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdcdcdc);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.z = 2; // Initial position (will be adjusted on load)

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 1000; // Increased max distance

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Handle file upload
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    loadingMessage.style.display = 'flex';
                    loadingMessage.innerHTML = `<div class="text-gray-500 font-semibold animate-pulse">Loading model...</div>`;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const uploadedData = JSON.parse(e.target.result);
                            renderModel(uploadedData);
                        } catch (error) {
                            loadingMessage.style.display = 'flex';
                            loadingMessage.innerHTML = `<div class="text-red-500 font-semibold">Invalid JSON file. Please upload a valid JSON.</div>`;
                            console.error('Error reading file:', error);
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            });
        };
    </script>
</body>
</html>
