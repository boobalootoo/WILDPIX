<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Voxel Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    canvas {
      cursor: crosshair;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 p-8 flex flex-col items-center justify-center min-h-screen">
  <div class="container flex flex-col md:flex-row gap-8 w-full max-w-7xl">
    <!-- Control Panel -->
    <div class="panel bg-gray-800 p-6 rounded-xl shadow-lg flex-1 flex flex-col">
      <h1 class="text-2xl font-bold mb-4">Voxelizer</h1>
      <p class="text-sm text-gray-400 mb-4">
        Upload an image, click four points to define a rectangle, and generate your 3D model.
      </p>
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Upload Image</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-gray-300">
      </div>
      <div id="image-container" class="relative mb-4">
        <canvas id="imageCanvas" class="border-2 border-gray-600 rounded-lg"></canvas>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm text-gray-400">X Sections</label>
          <input type="number" id="xSections" value="16" min="1" max="64"
                 class="bg-gray-700 text-gray-200 rounded-md p-2 w-full">
        </div>
        <div>
          <label class="block text-sm text-gray-400">Y Sections</label>
          <input type="number" id="ySections" value="16" min="1" max="64"
                 class="bg-gray-700 text-gray-200 rounded-md p-2 w-full">
        </div>
        <div>
          <label class="block text-sm text-gray-400">Z Sections</label>
          <input type="number" id="zSections" value="16" min="1" max="64"
                 class="bg-gray-700 text-gray-200 rounded-md p-2 w-full">
        </div>
      </div>
      <button id="generateButton"
              class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Generate Voxel Model</button>
      <button id="downloadButton" class="mt-2 hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Download Voxel Data (JSON)</button>
      <button id="resetButton" class="mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Reset Selection</button>
    </div>

    <!-- 3D Preview -->
    <div class="panel bg-gray-800 p-6 rounded-xl shadow-lg relative flex-1 flex flex-col">
      <h2 class="text-2xl font-bold mb-4">3D Voxel Preview</h2>
      <div id="threejs-container" class="flex-grow"></div>
      <div id="jsonPreviewSection" class="mt-4 hidden">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-lg font-bold">JSON Data Preview</h3>
          <button id="copyJsonButton" class="bg-gray-700 hover:bg-gray-600 text-sm px-3 py-1 rounded-md">Copy JSON</button>
        </div>
        <div id="jsonPreview" class="bg-gray-900 text-gray-300 p-4 rounded-lg overflow-auto text-xs max-h-48 whitespace-pre"></div>
      </div>
    </div>
  </div>
  <div id="messageBox"
       class="fixed top-4 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300">
  </div>

  <script>
    // Elements
    const imageInput = document.getElementById('imageInput');
    const imageCanvas = document.getElementById('imageCanvas');
    const ctx = imageCanvas.getContext('2d');
    const generateButton = document.getElementById('generateButton');
    const downloadButton = document.getElementById('downloadButton');
    const threejsContainer = document.getElementById('threejs-container');
    const xSectionsInput = document.getElementById('xSections');
    const ySectionsInput = document.getElementById('ySections');
    const zSectionsInput = document.getElementById('zSections');
    const resetButton = document.getElementById('resetButton');
    const messageBox = document.getElementById('messageBox');
    const jsonPreviewSection = document.getElementById('jsonPreviewSection');
    const jsonPreview = document.getElementById('jsonPreview');
    const copyJsonButton = document.getElementById('copyJsonButton');

    // Three.js
    let scene, camera, renderer;
    let voxelsGroup = new THREE.Group();

    // State
    let originalImage = null;
    let selectionPoints = [];
    let lastVoxelDataJson = null;

    function initThreeJS() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      camera = new THREE.PerspectiveCamera(75, threejsContainer.clientWidth / threejsContainer.clientHeight, 0.1, 1000);
      camera.position.set(30, 30, 30);
      camera.lookAt(0, 0, 0);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(threejsContainer.clientWidth, threejsContainer.clientHeight);
      threejsContainer.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0x404040));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(50, 50, 50);
      scene.add(light);
      scene.add(voxelsGroup);
      animate();
    }

    function getPixelColor(imageData, x, y) {
      const index = (y * imageData.width + x) * 4;
      return {
        r: imageData.data[index],
        g: imageData.data[index + 1],
        b: imageData.data[index + 2]
      };
    }

    async function generateVoxels() {
      if (selectionPoints.length < 4 || !originalImage) {
        showMessage("Upload an image and select 4 points.");
        return;
      }

      // Clear old voxels
      while (voxelsGroup.children.length > 0) {
        const obj = voxelsGroup.children[0];
        obj.geometry.dispose();
        obj.material.dispose();
        voxelsGroup.remove(obj);
      }

      const xSections = parseInt(xSectionsInput.value, 10);
      const ySections = parseInt(ySectionsInput.value, 10);
      const zSections = parseInt(zSectionsInput.value, 10);

      // Scale selection from canvas to image coordinates
      const scaleX = originalImage.width / imageCanvas.width;
      const scaleY = originalImage.height / imageCanvas.height;
      const minX = Math.min(...selectionPoints.map(p => p.x)) * scaleX;
      const minY = Math.min(...selectionPoints.map(p => p.y)) * scaleY;
      const maxX = Math.max(...selectionPoints.map(p => p.x)) * scaleX;
      const maxY = Math.max(...selectionPoints.map(p => p.y)) * scaleY;

      const selectionWidth = maxX - minX;
      const selectionHeight = maxY - minY;
      const xStep = selectionWidth / xSections;
      const yStep = selectionHeight / ySections;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = originalImage.width;
      tempCanvas.height = originalImage.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(originalImage, 0, 0);
      const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

      const voxelData = [];

      for (let z = 0; z < zSections; z++) {
        for (let y = 0; y < ySections; y++) {
          for (let x = 0; x < xSections; x++) {
            const pixelX = Math.floor(minX + x * xStep);
            const pixelY = Math.floor(minY + y * yStep);
            if (pixelX >= 0 && pixelX < imageData.width && pixelY >= 0 && pixelY < imageData.height) {
              const pixelColor = getPixelColor(imageData, pixelX, pixelY);
              const depthFactor = 1 - (z / (zSections * 2));
              const finalColor = new THREE.Color(
                (pixelColor.r / 255) * depthFactor,
                (pixelColor.g / 255) * depthFactor,
                (pixelColor.b / 255) * depthFactor
              );
              const voxel = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshLambertMaterial({ color: finalColor })
              );
              voxel.position.set(
                (x - xSections / 2) * 1.1,
                (y - ySections / 2) * 1.1,
                (z - zSections / 2) * 1.1
              );
              voxelsGroup.add(voxel);
              voxelData.push({ x, y, z, color: "#" + finalColor.getHexString() });
            }
          }
        }
      }

      // Center model
      if (voxelData.length > 0) {
        const box = new THREE.Box3().setFromObject(voxelsGroup);
        const center = box.getCenter(new THREE.Vector3());
        voxelsGroup.position.sub(center);
      }

      lastVoxelDataJson = JSON.stringify(voxelData, null, 2);
      jsonPreview.textContent = lastVoxelDataJson;
      downloadButton.classList.remove('hidden');
      jsonPreviewSection.classList.remove('hidden');
      showMessage("Voxel model generated!");
    }

    function drawRectangle() {
      ctx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
      if (originalImage) {
        ctx.drawImage(originalImage, 0, 0, imageCanvas.width, imageCanvas.height);
      }
      selectionPoints.forEach(point => {
        ctx.fillStyle = 'rgba(59,130,246,0.5)';
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    imageCanvas.addEventListener('click', (e) => {
      if (!originalImage || selectionPoints.length >= 4) return;
      const rect = imageCanvas.getBoundingClientRect();
      selectionPoints.push({
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      });
      drawRectangle();
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalImage = new Image();
        originalImage.onload = () => {
          imageCanvas.width = 400;
          imageCanvas.height = 400 * (originalImage.height / originalImage.width);
          selectionPoints = [];
          drawRectangle();
        };
        originalImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    generateButton.addEventListener('click', generateVoxels);
    downloadButton.addEventListener('click', () => {
      if (!lastVoxelDataJson) return;
      const blob = new Blob([lastVoxelDataJson], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'voxel_data.json';
      a.click();
      URL.revokeObjectURL(url);
    });
    resetButton.addEventListener('click', () => {
      selectionPoints = [];
      lastVoxelDataJson = null;
      drawRectangle();
      while (voxelsGroup.children.length > 0) {
        const obj = voxelsGroup.children[0];
        obj.geometry.dispose();
        obj.material.dispose();
        voxelsGroup.remove(obj);
      }
      showMessage("Selection reset.");
    });
    copyJsonButton.addEventListener('click', () => {
      if (!lastVoxelDataJson) return;
      navigator.clipboard.writeText(lastVoxelDataJson);
      showMessage("JSON copied!");
    });

    function showMessage(msg) {
      messageBox.textContent = msg;
      messageBox.classList.remove('opacity-0');
      messageBox.classList.add('opacity-100');
      setTimeout(() => {
        messageBox.classList.add('opacity-0');
      }, 2000);
    }

    function animate() {
      requestAnimationFrame(animate);
      voxelsGroup.rotation.y += 0.005;
      renderer.render(scene, camera);
    }

    window.onload = initThreeJS;
  </script>
</body>
</html>
