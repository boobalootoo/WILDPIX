<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Map Pixelation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scrollbars */
            font-family: Arial, sans-serif;
        }
        #mapContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block; /* Always visible */
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <div id="map"></div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const map = L.map('map', {
            center: [54.5, -2.5],
            zoom: 6,
            // The maxZoom is now set to 19 to align with the maxNativeZoom of the tile layer.
            // This prevents the user from zooming into an area that has no new, higher-resolution imagery.
            maxZoom: 19,
            minZoom: 6,
            layers: [
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                    crossOrigin: true,
                    // The tile provider itself only has imagery up to zoom level 18.
                    maxNativeZoom: 18
                })
            ]
        });

        function applyPixelation() {
            const size = map.getSize();
            canvas.width = size.x;
            canvas.height = size.y;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            html2canvas(document.getElementById('map'), { useCORS: true })
                .then((capturedCanvas) => {
                    if (capturedCanvas.width === 0 || capturedCanvas.height === 0) {
                        console.error("html2canvas failed to capture the map.");
                        return;
                    }

                    ctx.drawImage(capturedCanvas, 0, 0, canvas.width, canvas.height);

                    const metersPerPixel = 156543.03392 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom());

                    let desiredMeterSize;
                    const zoom = map.getZoom();
                    if (zoom >= 18) {
                        desiredMeterSize = 1;
                    } else if (zoom >= 15) {
                        desiredMeterSize = 10;
                    } else if (zoom >= 12) {
                        desiredMeterSize = 100;
                    } else if (zoom >= 9) {
                        desiredMeterSize = 1000;
                    } else {
                        desiredMeterSize = 10000;
                    }

                    const pixelSizeX = Math.max(1, Math.floor(desiredMeterSize / metersPerPixel));
                    const pixelSizeY = Math.max(1, Math.floor(desiredMeterSize / metersPerPixel));
                    
                    for (let y = 0; y < canvas.height; y += pixelSizeY) {
                        for (let x = 0; x < canvas.width; x += pixelSizeX) {
                            const width = Math.max(1, Math.min(pixelSizeX, canvas.width - x));
                            const height = Math.max(1, Math.min(pixelSizeY, canvas.height - y));
                            
                            const imageData = ctx.getImageData(x, y, width, height);
                            const data = imageData.data;
                            let r = 0, g = 0, b = 0, count = 0;
                            
                            for (let i = 0; i < data.length; i += 4) {
                                r += data[i];
                                g += data[i + 1];
                                b += data[i + 2];
                                count++;
                            }

                            r = Math.floor(r / count);
                            g = Math.floor(g / count);
                            b = Math.floor(b / count);

                            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                            ctx.fillRect(x, y, width, height);
                        }
                    }
                })
                .catch(error => {
                    console.error("html2canvas failed to capture the map:", error);
                });
        }
        
        let pixelationTimer;
        map.on('moveend', () => {
            clearTimeout(pixelationTimer);
            pixelationTimer = setTimeout(applyPixelation, 1000);
        });

    </script>
</body>
</html>
