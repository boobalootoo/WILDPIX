<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Map Pixelation + Sightings + Compass</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #mapContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* map is lowest */
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
            z-index: 2; /* pixelation layer */
        }
        #messageBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            z-index: 3;
            display: none;
        }
        .species-icon {
            border-radius: 50%;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <div id="map"></div>
        <canvas id="canvas"></canvas>
        <div id="messageBox"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        let userLocation = null;
        let userMarker = null;
        let arrowElement = null;

        // Init map
        const map = L.map('map', {
            center: [54.5, -2.5],
            zoom: 6,
            maxZoom: 18,
            minZoom: 6,
            layers: [
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles © Esri',
                    maxNativeZoom: 18,
                    maxZoom: 18
                })
            ]
        });

        // Pixelation function
        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
        }

        function applyPixelation() {
            const size = map.getSize();
            canvas.width = size.x;
            canvas.height = size.y;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            messageBox.style.display = 'none';

            html2canvas(document.getElementById('map'), { useCORS: true })
                .then((capturedCanvas) => {
                    if (capturedCanvas.width === 0 || capturedCanvas.height === 0) {
                        console.error("html2canvas failed to capture the map.");
                        showMessage("Pixelation failed (CORS issue).");
                        return;
                    }

                    ctx.drawImage(capturedCanvas, 0, 0, canvas.width, canvas.height);

                    const metersPerPixel = 156543.03392 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom());

                    let desiredMeterSize;
                    const zoom = map.getZoom();
                    if (zoom >= 18) desiredMeterSize = 1;
                    else if (zoom >= 15) desiredMeterSize = 10;
                    else if (zoom >= 12) desiredMeterSize = 100;
                    else if (zoom >= 9) desiredMeterSize = 1000;
                    else desiredMeterSize = 10000;

                    const pixelSizeX = desiredMeterSize / metersPerPixel;
                    const pixelSizeY = desiredMeterSize / metersPerPixel;
                    
                    for (let y = 0; y < canvas.height; y += pixelSizeY) {
                        for (let x = 0; x < canvas.width; x += pixelSizeX) {
                            const width = Math.min(pixelSizeX, canvas.width - x);
                            const height = Math.min(pixelSizeY, canvas.height - y);
                            const imageData = ctx.getImageData(x, y, width, height);
                            const data = imageData.data;
                            let r = 0, g = 0, b = 0, count = 0;
                            for (let i = 0; i < data.length; i += 4) {
                                r += data[i]; g += data[i+1]; b += data[i+2]; count++;
                            }
                            r = Math.floor(r / count);
                            g = Math.floor(g / count);
                            b = Math.floor(b / count);
                            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                            ctx.fillRect(x, y, width, height);
                        }
                    }
                })
                .catch(error => {
                    console.error("html2canvas error:", error);
                    showMessage("Pixelation error.");
                });
        }

        // Location
        function onLocationFound(e) {
            userLocation = e.latlng;
            map.setView(userLocation, 18);
            if (!userMarker) {
                const smileyIcon = L.divIcon({
                    html: `<div style="position: relative; width:40px; height:40px;">
                             <div style="width:32px;height:32px;background:yellow;border-radius:50%;border:2px solid black;position:absolute;top:4px;left:4px;">
                               <div style="position:absolute;left:8px;top:10px;width:4px;height:4px;background:black;border-radius:50%;"></div>
                               <div style="position:absolute;right:8px;top:10px;width:4px;height:4px;background:black;border-radius:50%;"></div>
                               <div style="position:absolute;left:8px;bottom:8px;width:16px;height:4px;background:black;border-radius:2px;"></div>
                             </div>
                             <div id="arrow" style="position:absolute;width:2px;height:30px;background:red;top:-20px;left:19px;transform-origin:bottom center;"></div>
                           </div>`,
                    className: ''
                });
                userMarker = L.marker(userLocation, {icon: smileyIcon, interactive: false}).addTo(map);
                arrowElement = document.getElementById("arrow");
            } else {
                userMarker.setLatLng(userLocation);
            }
        }
        function onLocationError(e) { showMessage("Location error: " + e.message); }
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        window.onload = () => {
            map.locate({setView: true, maxZoom: 18});
            applyPixelation();
            loadSightings();
        };
        let pixelationTimer;
        map.on('moveend', () => {
            clearTimeout(pixelationTimer);
            pixelationTimer = setTimeout(applyPixelation, 1000);
        });

        // ✅ Load species sightings
        function loadSightings() {
            const csvUrl = "https://raw.githubusercontent.com/boobalootoo/WILDPIX/main/cardinfo.csv";
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const grouped = {};
                    results.data.forEach(row => {
                        if (row["example coords"] && row["image"]) {
                            const parts = row["example coords"].split(",");
                            if (parts.length === 2) {
                                const lat = parseFloat(parts[0].trim());
                                const lon = parseFloat(parts[1].trim());
                                if (!isNaN(lat) && !isNaN(lon)) {
                                    const key = `${lat},${lon}`;
                                    if (!grouped[key]) grouped[key] = [];
                                    grouped[key].push({ name: row["Common Name"] || "Unknown species", image: row["image"] });
                                }
                            }
                        }
                    });

                    Object.keys(grouped).forEach(key => {
                        const [lat, lon] = key.split(",").map(Number);
                        const entries = grouped[key];
                        let index = 0;

                        function getPopupContent() {
                            const e = entries[index];
                            return `<div style="text-align:center;">
                                      <strong>${e.name}</strong><br>
                                      <img src="${e.image}" width="120"><br>
                                      ${entries.length > 1 ? `
                                      <button onclick="prevImage('${key}')">&lt; Prev</button>
                                      <button onclick="nextImage('${key}')">Next &gt;</button>
                                      <p>${index+1} / ${entries.length}</p>` : ""}
                                    </div>`;
                        }

                        const icon = L.icon({iconUrl: entries[0].image, iconSize: [40,40], className:"species-icon"});
                        const marker = L.marker([lat, lon], {icon}).addTo(map);
                        marker.bindPopup(getPopupContent());
                        marker._galleryData = {entries, index, getPopupContent, marker};
                    });
                }
            });
        }

        // ✅ Gallery controls
        function prevImage(key) {
            updateGallery(key, -1);
        }
        function nextImage(key) {
            updateGallery(key, 1);
        }
        function updateGallery(key, step) {
            map.eachLayer(layer => {
                if (layer._galleryData) {
                    const pos = `${layer.getLatLng().lat},${layer.getLatLng().lng}`;
                    if (pos === key) {
                        const data = layer._galleryData;
                        data.index = (data.index + step + data.entries.length) % data.entries.length;
                        layer.setPopupContent(data.getPopupContent());
                    }
                }
            });
        }

        // ✅ Device orientation arrow
        if (window.DeviceOrientationEvent) {
            window.addEventListener("deviceorientation", (event) => {
                if (arrowElement && event.alpha !== null) {
                    arrowElement.style.transform = `rotate(${event.alpha}deg)`;
                }
            });
        }
    </script>
</body>
</html>
