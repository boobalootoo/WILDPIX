<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Map Pixelation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scrollbars */
            font-family: Arial, sans-serif;
        }
        #mapContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block; /* Always visible */
            z-index: 2;
        }
        #messageBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            z-index: 3;
            display: none;
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <div id="map"></div>
        <canvas id="canvas"></canvas>
        <div id="messageBox"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        let userLocation = null;
        let locationMarker = null;

        const map = L.map('map', {
            center: [54.5, -2.5],
            zoom: 6,
            maxZoom: 18,
            minZoom: 6,
            layers: [
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles © Esri',
                    maxNativeZoom: 18,
                    maxZoom: 18
                })
            ]
        });

        // Use a standard HTML Image object to draw on canvas
        const smileyImage = new Image();
        smileyImage.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect fill="%23FFD700" width="16" height="16"/><rect fill="%23000000" x="4" y="4" width="2" height="2"/><rect fill="%23000000" x="10" y="4" width="2" height="2"/><path fill="%23000000" d="M4,10 C4,12 6,14 8,14 C10,14 12,12 12,10 L10,10 C10,11 8,12 8,12 C6,12 6,11 6,10 L4,10Z"/></svg>';
        const markerSize = 32;
        const markerAnchorX = 16;
        const markerAnchorY = 16;

        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }

        function applyPixelation() {
            const size = map.getSize();
            canvas.width = size.x;
            canvas.height = size.y;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            messageBox.style.display = 'none';

            html2canvas(document.getElementById('map'), { useCORS: true })
                .then((capturedCanvas) => {
                    if (capturedCanvas.width === 0 || capturedCanvas.height === 0) {
                        console.error("html2canvas failed to capture the map, likely due to CORS.");
                        showMessage("Pixelation failed. This is likely due to CORS policy preventing access to cross-origin images.");
                        return;
                    }

                    ctx.drawImage(capturedCanvas, 0, 0, canvas.width, canvas.height);

                    const metersPerPixel = 156543.03392 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom());

                    let desiredMeterSize;
                    const zoom = map.getZoom();
                    if (zoom >= 18) {
                        desiredMeterSize = 1;
                    } else if (zoom >= 15) {
                        desiredMeterSize = 10;
                    } else if (zoom >= 12) {
                        desiredMeterSize = 100;
                    } else if (zoom >= 9) {
                        desiredMeterSize = 1000;
                    } else {
                        desiredMeterSize = 10000;
                    }

                    const pixelSizeX = desiredMeterSize / metersPerPixel;
                    const pixelSizeY = desiredMeterSize / metersPerPixel;
                    
                    for (let y = 0; y < canvas.height; y += pixelSizeY) {
                        for (let x = 0; x < canvas.width; x += pixelSizeX) {
                            const width = Math.min(pixelSizeX, canvas.width - x);
                            const height = Math.min(pixelSizeY, canvas.height - y);
                            
                            const imageData = ctx.getImageData(x, y, width, height);
                            const data = imageData.data;
                            let r = 0, g = 0, b = 0, count = 0;
                            
                            for (let i = 0; i < data.length; i += 4) {
                                r += data[i];
                                g += data[i + 1];
                                b += data[i + 2];
                                count++;
                            }

                            r = Math.floor(r / count);
                            g = Math.floor(g / count);
                            b = Math.floor(b / count);

                            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                            ctx.fillRect(x, y, width, height);
                        }
                    }

                    // Draw the marker on the canvas after pixelation is complete
                    if (userLocation && smileyImage.complete) {
                        const point = map.latLngToContainerPoint(userLocation);
                        ctx.drawImage(smileyImage, point.x - markerAnchorX, point.y - markerAnchorY, markerSize, markerSize);
                    }
                })
                .catch(error => {
                    console.error("html2canvas promise rejected:", error);
                    showMessage("An error occurred during pixelation. Please try again.");
                });
        }
        
        // Handle location success
        function onLocationFound(e) {
            userLocation = e.latlng;
            map.setView(userLocation, 18);
        }

        // Handle location error
        function onLocationError(e) {
            showMessage("Location access denied or unavailable: " + e.message);
        }

        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
        
        // Automatically locate the user on page load
        window.onload = () => {
            map.locate({setView: true, maxZoom: 18});
            applyPixelation();
        };

        let pixelationTimer;
        map.on('moveend', () => {
            clearTimeout(pixelationTimer);
            pixelationTimer = setTimeout(applyPixelation, 1000);
        });
    </script>
</body>
</html>
