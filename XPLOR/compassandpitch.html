<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Sensor Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .compass-dial {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: relative;
            background: conic-gradient(
                from 0deg,
                #3b82f6 0deg 22.5deg,
                #4f46e5 22.5deg 67.5deg,
                #3b82f6 67.5deg 112.5deg,
                #4f46e5 112.5deg 157.5deg,
                #3b82f6 157.5deg 202.5deg,
                #4f46e5 202.5deg 247.5deg,
                #3b82f6 247.5deg 292.5deg,
                #4f46e5 292.5deg 337.5deg,
                #3b82f6 337.5deg 360deg
            );
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease-out;
        }
        .compass-dial::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            background-color: #2d3748;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 100px;
            transform-origin: bottom center;
            transform: translateX(-50%) rotateZ(0deg);
            z-index: 10;
            transition: transform 0.2s ease-out;
        }
        .compass-needle::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #ef4444; /* Red for North */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: translateY(-100%);
        }
        .compass-needle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #94a3b8; /* Gray for South */
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
        }
        .cardinal-point {
            position: absolute;
            font-weight: bold;
            font-size: 1.25rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .cardinal-point.n { top: 5px; left: 50%; transform: translateX(-50%); color: #ef4444; }
        .cardinal-point.e { top: 50%; right: 5px; transform: translateY(-50%); }
        .cardinal-point.s { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .cardinal-point.w { top: 50%; left: 5px; transform: translateY(-50%); }

        .pitch-container {
            perspective: 600px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #2d3748;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pitch-bar {
            width: 100px;
            height: 15px;
            background-color: #3b82f6;
            border-radius: 9999px;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col justify-center items-center">

    <div class="flex flex-col items-center p-6 bg-gray-800 rounded-3xl shadow-xl w-full max-w-lg space-y-8">
        <h1 class="text-3xl font-bold mb-2">Sensor Hub</h1>

        <!-- Compass Section -->
        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-2">Compass</h2>
            <div class="compass-dial relative mb-4">
                <span class="cardinal-point n">N</span>
                <span class="cardinal-point e">E</span>
                <span class="cardinal-point s">S</span>
                <span class="cardinal-point w">W</span>
                <div class="compass-needle"></div>
            </div>
            <span id="heading-text" class="text-3xl font-extrabold text-blue-400">--°</span>
        </div>

        <!-- Horizontal Line -->
        <hr class="w-full border-t-2 border-gray-700">

        <!-- Pitch Section -->
        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-2">Pitch</h2>
            <p class="text-gray-400 mb-4">Tilt your device forwards and backwards.</p>
            <div class="relative w-full flex flex-col items-center">
                <div class="pitch-container">
                    <div id="pitch-bar" class="pitch-bar"></div>
                </div>
                <span id="pitch-text" class="text-3xl font-extrabold text-blue-400 mt-4">0°</span>
            </div>
        </div>

        <!-- Status/Info Message -->
        <div id="status-message" class="text-sm font-semibold text-orange-400 mt-6 text-center">
            Checking for sensor access...
        </div>

    </div>

    <script>
        const headingText = document.getElementById('heading-text');
        const compassNeedle = document.querySelector('.compass-needle');
        const pitchText = document.getElementById('pitch-text');
        const pitchBar = document.getElementById('pitch-bar');
        const statusMessage = document.getElementById('status-message');
        
        // This function determines the cardinal direction from a heading angle
        function getDirection(heading) {
            if (heading >= 337.5 || heading < 22.5) return 'N';
            if (heading >= 22.5 && heading < 67.5) return 'NE';
            if (heading >= 67.5 && heading < 112.5) return 'E';
            if (heading >= 112.5 && heading < 157.5) return 'SE';
            if (heading >= 157.5 && heading < 202.5) return 'S';
            if (heading >= 202.5 && heading < 247.5) return 'SW';
            if (heading >= 247.5 && heading < 292.5) return 'W';
            if (heading >= 292.5 && heading < 337.5) return 'NW';
            return 'N/A';
        }

        function handleOrientation(event) {
            // Compass Logic (alpha)
            let heading = event.webkitCompassHeading || (360 - event.alpha);
            headingText.textContent = `${Math.round(heading)}° ${getDirection(heading)}`;
            compassNeedle.style.transform = `translateX(-50%) rotateZ(${heading}deg)`;

            // Pitch Logic (beta)
            let pitch = event.beta;
            pitchText.textContent = `${Math.round(pitch)}°`;
            pitchBar.style.transform = `rotateX(${pitch}deg)`;

            // Clear the status message once sensors are working
            if (statusMessage.textContent !== '') {
                statusMessage.textContent = '';
            }
        }

        window.onload = function() {
            if (window.DeviceOrientationEvent) {
                // Check if we need to request permission (for iOS 13+ and similar devices)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    statusMessage.textContent = 'Swipe right on your screen and click on "Allow" to enable motion sensors.';
                    // Add an event listener for user interaction to trigger permission request
                    window.addEventListener('click', () => {
                         DeviceOrientationEvent.requestPermission()
                            .then(permissionState => {
                                if (permissionState === 'granted') {
                                    window.addEventListener('deviceorientation', handleOrientation);
                                    statusMessage.textContent = '';
                                } else {
                                    statusMessage.textContent = 'Permission denied. Cannot access sensors.';
                                }
                            })
                            .catch(error => {
                                console.error(error);
                                statusMessage.textContent = 'An error occurred. Please refresh and try again.';
                            });
                    });
                } else {
                    // For older devices or browsers that don't need a specific request
                    window.addEventListener('deviceorientation', handleOrientation);
                    statusMessage.textContent = '';
                }
            } else {
                statusMessage.textContent = 'Your browser does not support device motion sensors.';
            }
        };
    </script>
</body>
</html>
